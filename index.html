<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Кинологический центр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   «Кинологический центр» — тема «Родословный клуб / выставочная награда»
   Тёплый пергамент · хвойный зелёный · кожаный тан · розеточно-красный акцент
   Заголовки — Playfair Display (родословная/сертификат), интерфейс — Golos Text.
   Имена CSS-переменных и классов сохранены (на них завязан JS).
   ========================================================================= */
:root{
  color-scheme:light;
  /* поверхности */
  --bg:#f4f0e8; --panel:#fffdf8; --panel-2:#fbf7ef;
  --line:#e8e1d2; --line2:#f1ece0;
  --ink:#2b2722; --muted:#8a8374; --muted2:#aaa392;
  /* акценты (имена сохранены, значения — новая палитра) */
  --green:#2f6b4f;  --green-d:#255a42; --green-l:#e5efe6;   /* хвоя — primary */
  --blue:#456f8d;   --blue-l:#e7eef4;                        /* сталь — info */
  --amber:#b0803c;  --amber-l:#f5ecd8;                       /* кожа/тан — warning */
  --red:#b23a48;    --red-l:#f7e5e6;                         /* розетка — danger */
  --gold:#c39a44;   --gold-l:#f4ead0;                        /* лента награды */
  /* геометрия */
  --radius:15px; --r-sm:10px; --r-lg:20px;
  --shadow:0 1px 2px rgba(70,54,30,.05), 0 10px 30px rgba(70,54,30,.07);
  --shadow-sm:0 1px 2px rgba(70,54,30,.06);
  --shadow-lg:0 24px 60px rgba(50,40,22,.20);
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --sans:'Golos Text',-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--ink); font-size:15px; line-height:1.5;
  -webkit-text-size-adjust:100%;
  background:
    radial-gradient(1100px 520px at 100% -8%, #efe7d4 0%, transparent 58%),
    radial-gradient(900px 480px at -8% 108%, #e8efe4 0%, transparent 55%),
    var(--bg);
  background-attachment:fixed;
}
a{color:var(--green);text-decoration:none}
button{font-family:inherit}
::selection{background:var(--gold-l)}

/* тонкие полосы-скроллы */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:#ded5c2;border-radius:20px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:#cdc2ab;background-clip:content-box}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg, rgba(255,253,248,.96), rgba(255,253,248,.9));
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 6px 20px rgba(70,54,30,.04)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;
  background:linear-gradient(90deg,var(--green) 0%,var(--gold) 45%,var(--amber) 70%,transparent 100%);opacity:.55}
.hwrap{max-width:1140px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:11px;white-space:nowrap}
.brand .logo{width:34px;height:37px;flex-shrink:0;display:block;filter:drop-shadow(0 2px 3px rgba(70,54,30,.18))}
.brand .txt{font-family:var(--serif);font-weight:700;font-size:20px;letter-spacing:.2px;
  color:var(--ink);line-height:1}
nav.tabs{display:flex;gap:2px;margin-left:6px;overflow-x:auto;flex:1;
  scrollbar-width:none;-ms-overflow-style:none}
nav.tabs::-webkit-scrollbar{display:none;height:0;width:0}
nav.tabs button{border:0;background:none;color:var(--muted);font-size:14.5px;
  padding:9px 13px;border-radius:10px;cursor:pointer;white-space:nowrap;font-weight:500;
  transition:background .15s,color .15s}
nav.tabs button:hover{color:var(--ink);background:var(--line2)}
nav.tabs button.active{background:var(--green-l);color:var(--green-d);font-weight:600;
  box-shadow:inset 0 0 0 1px rgba(47,107,79,.14)}
.hspace{flex:1}
.logout{color:var(--muted);font-size:13px;padding:7px 13px;border:1px solid var(--line);
  border-radius:9px;white-space:nowrap;margin-left:auto;flex-shrink:0;background:var(--panel);
  transition:.15s}
.logout:hover{border-color:var(--red);color:var(--red);background:var(--red-l)}
@media(max-width:960px) and (min-width:721px){ .brand .txt{display:none} }
@media(max-width:860px) and (min-width:721px){ nav.tabs button{padding:9px 8px;font-size:13px} }

main{max-width:1140px;margin:0 auto;padding:22px 18px 96px;animation:rise .4s ease both}

/* заголовки страниц */
h2.page{font-family:var(--serif);font-size:27px;margin:2px 0 18px;font-weight:700;letter-spacing:.2px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h2.page::before{content:"";width:5px;height:26px;border-radius:3px;
  background:linear-gradient(var(--green),var(--gold));display:inline-block}
.sub{color:var(--muted);font-size:13.5px}

/* ---------- toolbar / search ---------- */
.bar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.search{flex:1;min-width:180px;position:relative}
.search input{width:100%;padding:12px 14px 12px 40px;border:1px solid var(--line);
  border-radius:12px;font-size:15px;background:var(--panel);outline:none;transition:.15s;box-shadow:var(--shadow-sm)}
.search input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(47,107,79,.14)}
.search::before{content:"🔍";position:absolute;left:13px;top:50%;transform:translateY(-50%);
  font-size:14px;opacity:.45}
select.filter{padding:11px 13px;border:1px solid var(--line);border-radius:12px;
  background:var(--panel);font-size:14px;outline:none;box-shadow:var(--shadow-sm);cursor:pointer}
select.filter:focus{border-color:var(--green)}

/* ---------- buttons ---------- */
.btn{border:0;border-radius:12px;padding:11px 18px;font-size:14.5px;font-weight:600;
  cursor:pointer;color:#fff;display:inline-flex;align-items:center;gap:7px;line-height:1.1;
  background:var(--green);box-shadow:0 2px 5px rgba(47,107,79,.28),inset 0 1px 0 rgba(255,255,255,.16);
  transition:transform .1s, box-shadow .15s, background .15s}
.btn:hover{background:var(--green-d);box-shadow:0 4px 12px rgba(47,107,79,.32)}
.btn:active{transform:translateY(1px)}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:10px}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line);
  box-shadow:var(--shadow-sm)}
.btn.ghost:hover{background:var(--panel-2);border-color:#d9cfba}
.btn.blue{background:var(--blue);box-shadow:0 2px 6px rgba(69,111,141,.3)}.btn.blue:hover{filter:brightness(.95)}
.btn.danger{background:var(--red);box-shadow:0 2px 6px rgba(178,58,72,.3)}.btn.danger:hover{filter:brightness(.95)}
.btn.amber{background:var(--amber);box-shadow:0 2px 6px rgba(176,128,60,.3)}.btn.amber:hover{filter:brightness(.96)}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}

/* ---------- cards / grid ---------- */
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
.stat{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;box-shadow:var(--shadow);overflow:hidden;transition:transform .15s,box-shadow .15s}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.stat::after{content:"";position:absolute;right:-24px;top:-24px;width:78px;height:78px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,var(--green-l),transparent 70%);opacity:.8}
.stat .n{font-family:var(--serif);font-size:32px;font-weight:700;line-height:1;color:var(--ink);position:relative}
.stat .l{color:var(--muted);font-size:13px;margin-top:7px;font-weight:500;position:relative}
.stat.warn .n{color:var(--amber)}
.stat.warn::after{background:radial-gradient(circle at 30% 30%,var(--amber-l),transparent 70%)}

.list{display:grid;gap:11px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:15px 17px;box-shadow:var(--shadow);transition:transform .14s,box-shadow .14s,border-color .14s;
  animation:rise .35s ease both}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:#ddd3bf}
.card .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card .title{font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:.1px}
.card .meta{color:var(--muted);font-size:13px;margin-top:4px;line-height:1.55}
.card .meta b{color:var(--ink);font-weight:600}
.card .acts{display:flex;gap:6px;flex-shrink:0}
.icon-btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;
  width:35px;height:35px;cursor:pointer;font-size:15px;color:var(--muted);display:grid;place-items:center;transition:.14s}
.icon-btn:hover{color:var(--ink);background:var(--panel-2);border-color:#d9cfba}
.icon-btn.del:hover{color:var(--red);border-color:#eecccd;background:var(--red-l)}

.tag{display:inline-block;padding:3px 11px;border-radius:20px;font-size:12px;font-weight:600;
  background:var(--line2);color:var(--muted);border:1px solid transparent;line-height:1.5}
.tag.male{background:var(--blue-l);color:#375d78;border-color:#d4e2ee}
.tag.female{background:#f7e6ef;color:#a64c81;border-color:#efd3e2}
.tag.green{background:var(--green-l);color:var(--green-d);border-color:#cfe3d4}
.tag.amber{background:var(--amber-l);color:#8f6524;border-color:#ecdcbb}
.tag.red{background:var(--red-l);color:var(--red);border-color:#efcccd}
.tag.blue{background:var(--blue-l);color:#375d78;border-color:#d4e2ee}
.tag.grey{background:var(--panel-2);color:var(--muted);border-color:var(--line)}

.empty{text-align:center;color:var(--muted);padding:56px 20px}
.empty .em{font-size:44px;opacity:.6;display:block;margin-bottom:6px}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(43,33,18,.42);z-index:100;display:none;
  align-items:flex-start;justify-content:center;padding:26px 14px;overflow-y:auto;
  backdrop-filter:blur(2px)}
.overlay.on{display:flex;animation:fade .18s ease}
.modal{background:var(--panel);border-radius:var(--r-lg);width:min(660px,100%);
  box-shadow:var(--shadow-lg);margin:auto;border:1px solid var(--line);overflow:hidden;
  animation:pop .22s cubic-bezier(.2,.9,.3,1.2)}
.modal.wide{width:min(920px,100%)}
.modal .mhead{display:flex;justify-content:space-between;align-items:center;
  padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;
  background:linear-gradient(var(--panel),var(--panel-2));z-index:2}
.modal .mhead h3{margin:0;font-family:var(--serif);font-size:19px;font-weight:600}
.modal .mbody{padding:20px 22px}
.modal .mfoot{padding:15px 22px;border-top:1px solid var(--line);display:flex;
  gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:var(--panel)}
.close{border:0;background:none;font-size:25px;color:var(--muted2);cursor:pointer;line-height:1;
  width:34px;height:34px;border-radius:9px;transition:.14s}
.close:hover{color:var(--red);background:var(--red-l)}

/* ---------- forms ---------- */
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.2px}
.field label .req{color:var(--red)}
.field input,.field select,.field textarea{padding:11px 13px;border:1px solid var(--line);
  border-radius:11px;font-size:15px;background:var(--panel);outline:none;width:100%;font-family:inherit;
  transition:.15s;color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green);
  box-shadow:0 0 0 3px rgba(47,107,79,.13)}
.field textarea{resize:vertical;min-height:62px}
.fieldset-title{grid-column:1/-1;font-family:var(--serif);font-size:14px;font-weight:600;color:var(--green-d);
  margin:10px 0 -2px;padding-bottom:6px;border-bottom:1px solid var(--line2);
  display:flex;align-items:center;gap:8px}
.fieldset-title::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold)}

/* ---------- table (desktop) ---------- */
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow)}
table.data{width:100%;border-collapse:collapse;font-size:14px}
table.data th,table.data td{padding:11px 13px;text-align:left;border-bottom:1px solid var(--line2);white-space:nowrap}
table.data th{background:var(--panel-2);color:var(--muted);font-size:12px;font-weight:600;
  position:sticky;top:0;letter-spacing:.3px;text-transform:uppercase}
table.data tbody tr:last-child td{border-bottom:0}
table.data tr:hover td{background:#fbf8f1}
table.data td .in{padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;width:100%;
  background:var(--panel);font-family:inherit;transition:.14s}
table.data td .in:focus{border-color:var(--green);box-shadow:0 0 0 2px rgba(47,107,79,.12);outline:none}

/* ---------- event detail: степпер жизненного цикла ---------- */
.flow{display:flex;gap:0;flex-wrap:wrap;margin:16px 0 4px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:6px;box-shadow:var(--shadow)}
.flow .step{flex:1;min-width:96px;text-align:center;padding:11px 8px;border-radius:10px;
  color:var(--muted2);font-size:12.5px;font-weight:600;position:relative;transition:.2s}
.flow .step::before{content:"";display:block;width:20px;height:20px;margin:0 auto 6px;border-radius:50%;
  border:2px solid var(--line);background:var(--panel);transition:.2s}
.flow .step.done{color:var(--green-d)}
.flow .step.done::before{background:var(--green);border-color:var(--green);
  content:"✓";color:#fff;font-size:12px;line-height:16px;text-align:center}
.flow .step.cur{color:#fff;background:linear-gradient(var(--green),var(--green-d));
  box-shadow:0 4px 12px rgba(47,107,79,.3)}
.flow .step.cur::before{background:#fff;border-color:#fff}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:17px 19px;box-shadow:var(--shadow);margin-bottom:14px}
.panel>h3{margin:0 0 13px;font-family:var(--serif);font-size:17px;font-weight:600;
  display:flex;align-items:center;gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:14px}
.kv dt{color:var(--muted);font-weight:500}
.kv dd{margin:0;color:var(--ink)}
.docbtns{display:flex;gap:9px;flex-wrap:wrap}

/* ---------- toast ---------- */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;
  display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#33291a;color:#fff;padding:12px 22px;border-radius:12px;font-size:14px;font-weight:500;
  box-shadow:0 10px 28px rgba(0,0,0,.28);animation:tin .22s;border:1px solid rgba(255,255,255,.08)}
.toast.err{background:var(--red)}
.toast.ok{background:var(--green)}

/* ---------- animations ---------- */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.list .card:nth-child(1){animation-delay:.02s}.list .card:nth-child(2){animation-delay:.05s}
.list .card:nth-child(3){animation-delay:.08s}.list .card:nth-child(4){animation-delay:.11s}
.list .card:nth-child(5){animation-delay:.14s}.list .card:nth-child(6){animation-delay:.17s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- mobile ---------- */
.only-mobile{display:none}
@media(max-width:720px){
  .only-mobile{display:block}
  nav.tabs{position:fixed;bottom:0;left:0;right:0;
    background:linear-gradient(180deg,rgba(255,253,248,.97),var(--panel));
    border-top:1px solid var(--line);z-index:45;margin:0;padding:5px 4px env(safe-area-inset-bottom);
    justify-content:space-around;overflow-x:auto;box-shadow:0 -4px 20px rgba(70,54,30,.06)}
  nav.tabs button{flex:1;flex-direction:column;font-size:9.5px;line-height:1.06;gap:3px;
    padding:6px 2px;border-radius:10px;min-width:0;font-weight:600;white-space:normal;
    text-align:center;overflow-wrap:anywhere;word-break:break-word}
  nav.tabs button .ti{font-size:18px}
  nav.tabs button.active{background:var(--green-l);color:var(--green-d);box-shadow:none}
  .hspace{display:none}
  main{padding-bottom:82px}
  .formgrid{grid-template-columns:1fr}
  .hwrap{padding:10px 14px}
  h2.page{font-size:23px}
  .modal .mbody{padding:16px}
  .flow{padding:5px}
  .flow .step{min-width:0;padding:8px 4px;font-size:10.5px}
  .flow .step::before{width:16px;height:16px;margin-bottom:4px}
  .flow .step.done::before{line-height:12px;font-size:10px}
}
@media(min-width:721px){ nav.tabs button .ti{display:none} }
.hide{display:none!important}

</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand">
      <svg class="logo" viewBox="0 0 40 44" aria-hidden="true">
        <path d="M14 29 L11 43 L17.5 38.5 L20 44 L20 29 Z" fill="#b0803c"/>
        <path d="M26 29 L29 43 L22.5 38.5 L20 44 L20 29 Z" fill="#9a6d2f"/>
        <circle cx="20" cy="17" r="15" fill="#2f6b4f"/>
        <circle cx="20" cy="17" r="15" fill="none" stroke="#c39a44" stroke-width="1.2" stroke-dasharray="2.2 2.2"/>
        <circle cx="20" cy="17" r="9.4" fill="#f4f0e8"/>
        <g fill="#2f6b4f">
          <ellipse cx="20" cy="19.2" rx="3.3" ry="2.7"/>
          <circle cx="15.8" cy="15.2" r="1.5"/><circle cx="20" cy="13.7" r="1.6"/><circle cx="24.2" cy="15.2" r="1.5"/>
        </g>
      </svg>
      <span class="txt">Кинологический центр</span></div>
    <nav class="tabs" id="tabs">
      <button data-view="dashboard" class="active"><span class="ti">📊</span>Сводка</button>
      <button data-view="dogs"><span class="ti">🐕</span>Собаки</button>
      <button data-view="owners"><span class="ti">👤</span>Владельцы</button>
      <button data-view="payments"><span class="ti">💳</span>Взносы</button>
      <button data-view="events"><span class="ti">🏆</span>Выставки</button>
      <button data-view="refs"><span class="ti">⚙️</span>Справочники</button>
    </nav>
    <a class="logout" href="/logout">Выход</a>
  </div>
</header>
<main id="app"></main>
<div id="toast"></div>

<!-- modal root -->
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script>
// ============================================================ utils
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const app = $('#app');
let REFS = {classes:[],grades:[],titles:[]};
let BREEDS = [];      // [{id,name,breeds:[{id,name}]}]
let RANKS = [];       // [{id,name,grades:[],titles:[]}]
let ADDRESSES = [];   // [{id,name,address,phone,note}]
let OWNERS_CACHE = [];
async function loadRefs(){
  [REFS,BREEDS,RANKS,ADDRESSES] = await Promise.all([
    get('/api/refs'), get('/api/breeds'), get('/api/ranks'), get('/api/addresses')]);
}
const addrList = ()=>ADDRESSES.map(a=>a.address).filter(Boolean);

async function api(url,opts){
  const r = await fetch(url,opts);
  if(r.status===401){ location.href='/login'; return; }
  const ct = r.headers.get('content-type')||'';
  const data = ct.includes('json') ? await r.json() : await r.text();
  if(!r.ok){ throw new Error((data&&data.error)||'Ошибка'); }
  return data;
}
const get = u => api(u);
const post = (u,b) => api(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});
const del = u => api(u,{method:'DELETE'});

function toast(msg,type=''){
  const t=document.createElement('div');t.className='toast '+type;t.textContent=msg;
  $('#toast').appendChild(t);setTimeout(()=>t.remove(),2600);
}

// ---------- modal ----------
function openModal(html,wide){
  const m=$('#modal'); m.className='modal'+(wide?' wide':''); m.innerHTML=html;
  $('#overlay').classList.add('on'); document.body.style.overflow='hidden';
}
function closeModal(){ $('#overlay').classList.remove('on'); document.body.style.overflow=''; }
$('#overlay').addEventListener('click',e=>{ if(e.target.id==='overlay') closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

function field(label,name,val,{type='text',req=false,opts=null,ph='',full=false,rows=0,list=null}={}){
  const id='f_'+name;
  let input;
  if(opts){
    input=`<select id="${id}" name="${name}">${opts.map(o=>{
      const [v,t]=Array.isArray(o)?o:[o,o];
      return `<option value="${esc(v)}" ${String(v)===String(val??'')?'selected':''}>${esc(t)}</option>`;
    }).join('')}</select>`;
  }else if(rows){
    input=`<textarea id="${id}" name="${name}" rows="${rows}" placeholder="${esc(ph)}">${esc(val)}</textarea>`;
  }else{
    const dl=list?`list="dl_${name}"`:'';
    input=`<input id="${id}" name="${name}" type="${type}" value="${esc(val==null?'':val)}" placeholder="${esc(ph)}" ${dl}>`;
    if(list) input+=`<datalist id="dl_${name}">${list.map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`;
  }
  return `<div class="field ${full?'full':''}"><label>${esc(label)}${req?' <span class=req>*</span>':''}</label>${input}</div>`;
}
function formVals(root){
  const o={};
  $$('input,select,textarea',root).forEach(el=>{ if(el.name) o[el.name]=el.value.trim(); });
  return o;
}

const VIEWS={};
let current='dashboard';
async function boot(){
  await loadRefs();
  $$('#tabs button').forEach(b=>b.onclick=()=>go(b.dataset.view));
  // deep link to event
  const h=location.hash.match(/event-(\d+)/);
  if(h){ go('events'); setTimeout(()=>openEvent(+h[1]),50); }
  else go('dashboard');
}
function go(view){
  current=view;
  $$('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
  if(location.hash) history.replaceState(null,'',location.pathname);
  (VIEWS[view]||(()=>{}))();
}

async function eventForm(id){
  let e={};
  if(id){ const items=await get('/api/events'); e=items.find(x=>x.id===id)||{}; }
  openModal(`
    <div class="mhead"><h3>${id?'Мероприятие':'Новое мероприятие'}</h3><button class="close" onclick="closeModal()">×</button></div>
    <div class="mbody"><form id="frm" class="formgrid">
      ${field('Название','name',e.name,{req:true,full:true})}
      ${field('Тип','type',e.type||'show',{opts:Object.entries(EVTYPE)})}
      ${field('Ранг выставки','rank_id',e.rank_id,{opts:[['','— не задан —'],...RANKS.map(r=>[r.id,r.name])]})}
      ${field('Дата','event_date',e.event_date,{ph:'2026-09-20'})}
      ${field('Место проведения','place',e.place,{list:addrList()})}
      ${field('Судья(и)','judges',e.judges,{full:true,ph:'ФИО эксперта(ов)'})}
      ${field('Описание','description',e.description,{full:true,rows:2})}
    </form></div>
    <div class="mfoot"><button class="btn ghost" onclick="closeModal()">Отмена</button>
      <button class="btn" onclick="saveEvent(${id||0})">Сохранить</button></div>`);
}
async function saveEvent(id){
  const v=formVals($('#frm')); if(!v.name){toast('Укажите название','err');return;}
  if(id)v.id=id;
  try{ const r=await post('/api/events',v); closeModal(); toast('Сохранено','ok');
    openEvent(r.id||id); }catch(e){ toast(e.message,'err'); }
}

// ---------- event detail ----------
async function openEvent(id){
  go('events');
  const e=await get('/api/events/'+id);
  const idx=STATUS_ORDER.indexOf(e.status);
  const flow=STATUS_ORDER.map((s,i)=>`<div class="step ${i<idx?'done':i===idx?'cur':''}">${STATUS[s]}</div>`).join('');
  const canReg=['draft','reg_open'].includes(e.status);
  app.innerHTML=`
    <div class="bar"><button class="btn ghost sm" onclick="VIEWS.events()">← Все мероприятия</button>
      <div class="hspace" style="flex:1"></div>
      <button class="btn ghost sm" onclick="eventForm(${id})">✏️ Изменить</button>
      <button class="btn danger sm" onclick="delEvent(${id})">🗑 Удалить</button></div>
    <h2 class="page">${esc(e.name)} ${statusTag(e.status)}</h2>
    <div class="flow">${flow}</div>

    <div class="panel"><h3>Информация</h3>
      <dl class="kv">
        <dt>Тип</dt><dd>${EVTYPE[e.type]||''}</dd>
        <dt>Ранг</dt><dd>${esc(e.rank||'—')}</dd>
        <dt>Дата</dt><dd>${esc(e.event_date||'—')}</dd>
        <dt>Место</dt><dd>${esc(e.place||'—')}</dd>
        <dt>Судья(и)</dt><dd>${esc(e.judges||'—')}</dd>
        ${e.description?`<dt>Описание</dt><dd>${esc(e.description)}</dd>`:''}
      </dl>
    </div>

    <div class="panel"><h3>Управление этапами</h3>
      <div class="docbtns">
        ${e.status==='draft'?`<button class="btn" onclick="setStatus(${id},'reg_open')">▶ Открыть запись</button>`:''}
        ${e.status==='reg_open'?`<button class="btn amber" onclick="formCatalog(${id})">🔒 Закрыть запись и сформировать каталог</button>`:''}
        ${e.status==='reg_closed'?`<button class="btn blue" onclick="setStatus(${id},'judging')">⚖ Начать экспертизу</button>`:''}
        ${e.status==='judging'?`<button class="btn" onclick="setStatus(${id},'finished')">🏁 Завершить</button>`:''}
        ${idx>0?`<button class="btn ghost" onclick="setStatus(${id},'${STATUS_ORDER[idx-1]}')">↩ Вернуть на «${STATUS[STATUS_ORDER[idx-1]]}»</button>`:''}
      </div>
    </div>

    <div class="panel"><h3>Документы</h3>
      <div class="docbtns">
        <a class="btn ghost" href="/print/catalog/${id}" target="_blank">📖 Каталог</a>
        <a class="btn ghost" href="/print/ringsheet/${id}" target="_blank">📋 Ринговая ведомость</a>
        <a class="btn ghost" href="/print/diplomas/${id}" target="_blank">🎖 Дипломы</a>
        <a class="btn ghost" href="/print/report/${id}" target="_blank">📑 Отчёт</a>
      </div>
      <div class="sub" style="margin-top:8px">Каталог и ведомость доступны после формирования каталога; дипломы — после проставления оценок.</div>
    </div>

    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:8px">
        <h3 style="margin:0">Записанные собаки · ${e.stats.total}
          <span class="sub">(оценено ${e.stats.graded})</span></h3>
        ${canReg?`<button class="btn sm" onclick="addEntryDialog(${id})">＋ Записать собак</button>`:''}
      </div>
      <div id="entries"></div>
    </div>`;
  renderEntries(e);
}
function renderEntries(e){
  const box=$('#entries');
  if(!e.entries.length){ box.innerHTML=emptyBox('🐕','Собаки не записаны'); return; }
  const judging=['judging','finished','reg_closed'].includes(e.status);
  // оценки/титулы: если у ранга задан свой набор — берём его, иначе все из справочника
  const gradeOpts=['',...((e.rank_grades&&e.rank_grades.length)?e.rank_grades:REFS.grades.map(g=>g.name))];
  const titleOpts=(e.rank_titles&&e.rank_titles.length)?e.rank_titles:REFS.titles.map(t=>t.name);
  // desktop table
  const rows=e.entries.map(x=>{
    const badge=`<span class="tag ${x.sex==='male'?'male':'female'}" style="font-size:11px">${x.sex==='male'?'К':x.sex==='female'?'С':'—'}</span>`;
    if(judging){
      return `<tr>
        <td class="c">${x.catalog_no||'—'}</td>
        <td><b>${esc(x.dog_name)}</b> ${badge}<br><span class="sub">${esc(x.breed||'')}</span></td>
        <td>${esc(x.class_name||'')}</td>
        <td><select class="in" onchange="updEntry(${x.id},'grade',this.value)">
          ${gradeOpts.map(g=>`<option ${g===(x.grade||'')?'selected':''}>${esc(g)}</option>`).join('')}</select></td>
        <td><input class="in" style="width:52px" type="number" min="1" max="20" value="${x.placement||''}"
            onchange="updEntry(${x.id},'placement',this.value)"></td>
        <td><input class="in" list="dl_titles" value="${esc(x.titles||'')}" placeholder="титулы"
            onchange="updEntry(${x.id},'titles',this.value)"></td>
        <td><input class="in" value="${esc(x.remark||'')}" placeholder="описание"
            onchange="updEntry(${x.id},'remark',this.value)"></td>
        <td><button class="icon-btn del" onclick="delEntry(${x.id},${e.id})">🗑</button></td></tr>`;
    }
    const clsSel=['draft','reg_open'].includes(e.status)
      ? `<select class="in" onchange="updEntry(${x.id},'class_name',this.value)">
          <option value="">— класс —</option>
          ${REFS.classes.map(c=>`<option ${c.name===(x.class_name||'')?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`
      : esc(x.class_name||'');
    return `<tr>
      <td class="c">${x.catalog_no||'—'}</td>
      <td><b>${esc(x.dog_name)}</b> ${badge}<br><span class="sub">${esc(x.breed||'')} · ${esc(x.owner_name||'')}</span></td>
      <td>${clsSel}</td>
      <td>${esc(x.pedigree_number||'')}</td>
      <td><button class="icon-btn del" onclick="delEntry(${x.id},${e.id})">🗑</button></td></tr>`;
  }).join('');
  const head=judging
    ? `<tr><th>№</th><th>Собака</th><th>Класс</th><th>Оценка</th><th>Место</th><th>Титулы</th><th>Описание</th><th></th></tr>`
    : `<tr><th>№</th><th>Собака</th><th>Класс</th><th>Родословная</th><th></th></tr>`;
  box.innerHTML=`<div class="tablewrap"><table class="data">${head}${rows}</table></div>
    <datalist id="dl_titles">${titleOpts.map(t=>`<option value="${esc(t)}">`).join('')}</datalist>`;
}
async function updEntry(eid,field,val){
  try{ await post('/api/entries/'+eid,{[field]:val}); }catch(e){ toast(e.message,'err'); }
}
async function delEntry(eid,evid){ if(!confirm('Убрать собаку из мероприятия?'))return;
  await del('/api/entries/'+eid); toast('Убрано'); openEvent(evid); }
async function setStatus(id,st){ await post('/api/events/'+id+'/status',{status:st}); openEvent(id); }
async function formCatalog(id){
  if(!confirm('Закрыть запись и присвоить каталожные номера? Дальше собаки не добавляются (можно вернуть на предыдущий этап).'))return;
  const r=await post('/api/events/'+id+'/form-catalog',{});
  toast('Каталог сформирован: '+r.numbered+' собак','ok'); openEvent(id);
}
async function delEvent(id){ if(!confirm('Удалить мероприятие вместе со всеми записями?'))return;
  await del('/api/events/'+id); toast('Удалено'); VIEWS.events(); }

async function addEntryDialog(eid){
  const dogs=await get('/api/dogs');
  const e=await get('/api/events/'+eid);
  const already=new Set(e.entries.map(x=>x.dog_id));
  const avail=dogs.filter(d=>!already.has(d.id));
  openModal(`
    <div class="mhead"><h3>Записать собак на мероприятие</h3><button class="close" onclick="closeModal()">×</button></div>
    <div class="mbody">
      ${field('Класс (применится ко всем выбранным)','entry_class','',{opts:[['','— выбрать позже —'],...REFS.classes.map(c=>[c.name,c.name])],full:true})}
      <div class="search" style="margin:6px 0 10px"><input id="dq" placeholder="Фильтр собак..."></div>
      <div id="doglist" style="max-height:46vh;overflow-y:auto"></div>
    </div>
    <div class="mfoot"><button class="btn ghost" onclick="closeModal()">Отмена</button>
      <button class="btn" onclick="submitEntries(${eid})">Записать выбранных</button></div>`,true);
  const render=()=>{
    const q=($('#dq').value||'').toLowerCase();
    const list=avail.filter(d=>!q||(d.name+' '+(d.breed||'')+' '+(d.owner_name||'')).toLowerCase().includes(q));
    $('#doglist').innerHTML=list.length?list.map(d=>`
      <label class="card" style="display:flex;gap:10px;align-items:center;cursor:pointer;padding:10px 12px;margin-bottom:7px">
        <input type="checkbox" class="dchk" value="${d.id}" style="width:18px;height:18px">
        <div><b>${esc(d.name)}</b> <span class="sub">${esc(d.breed||'')} · ${d.sex==='male'?'кобель':d.sex==='female'?'сука':'—'} · ${esc(d.owner_name||'')}</span></div>
      </label>`).join(''):emptyBox('🐕',avail.length?'Ничего не найдено':'Все собаки уже записаны');
  };
  $('#dq').addEventListener('input',render); render();
}
async function submitEntries(eid){
  const ids=$$('.dchk').filter(c=>c.checked).map(c=>+c.value);
  if(!ids.length){toast('Выберите хотя бы одну собаку','err');return;}
  const cls=$('#f_entry_class')?$('#f_entry_class').value:'';
  const r=await post('/api/events/'+eid+'/entries',{dog_ids:ids,class_name:cls});
  closeModal(); toast('Записано: '+r.added,'ok'); openEvent(eid);
}

// ============================================================ REFS / справочники
const REFTABS=[['breeds','🌳 Породы'],['classes','Классы'],['grades','Оценки'],['titles','Титулы'],['ranks','🏆 Ранги выставок'],['addresses','📍 Адреса']];
const KINDLABEL={classes:'Классы',grades:'Оценки',titles:'Титулы'};
let refTab='breeds';
VIEWS.refs=async()=>{
  await loadRefs();
  app.innerHTML=`<h2 class="page">Справочники</h2>
    <div class="bar" style="gap:6px;flex-wrap:wrap">${REFTABS.map(([k,l])=>
      `<button class="btn ${k===refTab?'':'ghost'} sm" onclick="setRefTab('${k}')">${l}</button>`).join('')}</div>
    <div id="refbody"></div>`;
  const box=$('#refbody');
  if(refTab==='breeds') refBreeds(box);
  else if(refTab==='ranks') refRanks(box);
  else if(refTab==='addresses') refAddresses(box);
  else refSimpleList(box,refTab);
};
function setRefTab(k){ refTab=k; VIEWS.refs(); }

// ---- простые списки: классы / оценки / титулы ----
function refSimpleList(box,kind){
  const items=REFS[kind]||[];
  box.innerHTML=`<div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <h3 style="margin:0">${KINDLABEL[kind]} <span class="sub">(${items.length})</span></h3>
      <button class="btn ghost sm" onclick="bulkImport('${kind}')">⇪ Импорт списком</button></div>
    <p class="sub" style="margin:0 0 6px">Простой список — добавляйте и удаляйте значения под свой клуб.</p>
    <div id="ref_${kind}"></div>
    <div class="bar" style="margin:12px 0 0">
      <div class="search" style="flex:1"><input id="new_${kind}" placeholder="Добавить значение..." onkeydown="if(event.key==='Enter')addRef('${kind}')"></div>
      <button class="btn sm" onclick="addRef('${kind}')">＋ Добавить</button></div></div>`;
  renderRef(kind);
}
function renderRef(kind){
  const box=$('#ref_'+kind); if(!box)return;
  box.innerHTML=(REFS[kind]||[]).map(r=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line2)">
      <span>${esc(r.name)}</span>
      <button class="icon-btn del" style="width:30px;height:30px;font-size:14px" onclick="delRef('${kind}',${r.id})">×</button>
    </div>`).join('')||'<div class="sub">Пусто</div>';
}
async function addRef(kind){
  const inp=$('#new_'+kind); const name=inp.value.trim(); if(!name)return;
  const r=await post('/api/refs/'+kind,{name}); REFS[kind].push({id:r.id,name:r.name});
  inp.value=''; renderRef(kind); inp.focus();
}
async function delRef(kind,id){
  await del('/api/refs/'+kind+'/'+id);
  REFS[kind]=REFS[kind].filter(x=>x.id!==id); renderRef(kind);
}
function bulkImport(kind){
  openModal(`<div class="mhead"><h3>Импорт: ${KINDLABEL[kind]}</h3><button class="close" onclick="closeModal()">×</button></div>
    <div class="mbody"><p class="sub">Вставьте значения — по одному в строке. Дубли пропускаются.</p>
      <textarea id="bulktext" rows="10" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-family:inherit"></textarea></div>
    <div class="mfoot"><button class="btn ghost" onclick="closeModal()">Отмена</button>
      <button class="btn" onclick="doBulk('${kind}')">Загрузить</button></div>`);
}
async function doBulk(kind){
  const r=await post('/api/refs/'+kind+'/bulk',{text:$('#bulktext').value});
  REFS=await get('/api/refs'); closeModal(); toast('Добавлено: '+r.added,'ok'); VIEWS.refs();
}

// ---- дерево пород ----
function refBreeds(box){
  box.innerHTML=`<p class="sub" style="margin-top:-4px">Группы FCI и породы внутри. Можно добавлять и переименовывать группы и породы, загружать списком.</p>
    <div class="bar" style="margin:10px 0"><div class="search" style="flex:1">
      <input id="new_group" placeholder="Новая группа пород..." onkeydown="if(event.key==='Enter')addGroup()"></div>
      <button class="btn sm" onclick="addGroup()">＋ Группа</button></div>
    <div id="tree"></div>`;
  renderTree();
}
function renderTree(){
  const t=$('#tree'); if(!t)return;
  t.innerHTML=BREEDS.map(g=>`
    <div class="panel" style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <b style="font-size:15px">${esc(g.name)} <span class="sub">(${g.breeds.length})</span></b>
        <div class="acts">
          <button class="icon-btn" title="Переименовать" onclick="renameGroup(${g.id})">✏️</button>
          <button class="icon-btn del" onclick="delGroup(${g.id})">🗑</button></div></div>
      <div style="margin:9px 0 0;display:flex;flex-wrap:wrap;gap:6px">
        ${g.breeds.map(b=>`<span class="tag grey" style="display:inline-flex;gap:6px;align-items:center">${esc(b.name)}
          <span style="cursor:pointer;color:var(--red);font-weight:700" onclick="delBreed(${b.id})">×</span></span>`).join('')
          ||'<span class="sub">пород нет</span>'}
      </div>
      <div class="bar" style="margin:10px 0 0">
        <div class="search" style="flex:1"><input id="nb_${g.id}" placeholder="Добавить породу..." onkeydown="if(event.key==='Enter')addBreed(${g.id})"></div>
        <button class="btn sm" onclick="addBreed(${g.id})">＋</button>
        <button class="btn ghost sm" onclick="bulkBreeds(${g.id})">⇪ списком</button></div>
    </div>`).join('')||emptyBox('🌳','Групп пока нет');
}
async function addGroup(){
  const inp=$('#new_group'); const name=inp.value.trim(); if(!name)return;
  await post('/api/breed-groups',{name}); BREEDS=await get('/api/breeds'); inp.value=''; renderTree();
}
async function renameGroup(id){
  const g=BREEDS.find(x=>x.id===id); const name=prompt('Название группы:',g.name); if(name==null||!name.trim())return;
  await post('/api/breed-groups',{id,name:name.trim()}); BREEDS=await get('/api/breeds'); renderTree();
}
async function delGroup(id){
  if(!confirm('Удалить группу вместе со всеми породами внутри?'))return;
  await del('/api/breed-groups/'+id); BREEDS=await get('/api/breeds'); renderTree();
}
async function addBreed(gid){
  const inp=$('#nb_'+gid); const name=inp.value.trim(); if(!name)return;
  await post('/api/breeds',{group_id:gid,name}); BREEDS=await get('/api/breeds'); renderTree();
  setTimeout(()=>{const el=$('#nb_'+gid);if(el)el.focus();},0);
}
async function delBreed(id){
  await del('/api/breeds/'+id); BREEDS=await get('/api/breeds'); renderTree();
}
function bulkBreeds(gid){
  openModal(`<div class="mhead"><h3>Импорт пород в группу</h3><button class="close" onclick="closeModal()">×</button></div>
    <div class="mbody"><p class="sub">По одной породе в строке. Дубли пропускаются.</p>
      <textarea id="bulktext" rows="10" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-family:inherit"></textarea></div>
    <div class="mfoot"><button class="btn ghost" onclick="closeModal()">Отмена</button>
      <button class="btn" onclick="doBulkBreeds(${gid})">Загрузить</button></div>`);
}
async function doBulkBreeds(gid){
  const r=await post('/api/breeds/bulk',{group_id:gid,text:$('#bulktext').value});
  BREEDS=await get('/api/breeds'); closeModal(); toast('Добавлено: '+r.added,'ok'); renderTree();
}

// ---- ранги выставок (с наборами оценок и титулов) ----
function refRanks(box){
  box.innerHTML=`<p class="sub" style="margin-top:-4px">Для каждого ранга отметьте доступные <b>оценки</b> и <b>титулы</b> — именно они предлагаются при экспертизе и печатаются в дипломах и отчётах. Если ничего не отмечено — используются все.</p>
    <div class="bar" style="margin:10px 0"><div class="search" style="flex:1">
      <input id="new_rank" placeholder="Новый ранг выставки..." onkeydown="if(event.key==='Enter')addRank()"></div>
      <button class="btn sm" onclick="addRank()">＋ Ранг</button></div>
    <div id="ranks"></div>`;
  renderRanks();
}
function renderRanks(){
  const box=$('#ranks'); if(!box)return;
  const allG=REFS.grades.map(g=>g.name), allT=REFS.titles.map(t=>t.name);
  const chip=(rid,kind,n,on)=>`<span class="tag ${on?'green':'grey'}" style="cursor:pointer" onclick="toggleRank(${rid},'${kind}',${JSON.stringify(n)})">${on?'✓ ':''}${esc(n)}</span>`;
  box.innerHTML=RANKS.map(r=>`
    <div class="panel" style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <b style="font-size:15px">${esc(r.name)}</b>
        <div class="acts"><button class="icon-btn" onclick="renameRank(${r.id})">✏️</button>
          <button class="icon-btn del" onclick="delRank(${r.id})">🗑</button></div></div>
      <div class="sub" style="margin:10px 0 4px">Оценки${r.grades.length?'':' — <b>все</b>'}:</div>
      <div style="display:flex;flex-wrap:wrap;gap:5px">${allG.map(n=>chip(r.id,'grades',n,r.grades.includes(n))).join('')||'<span class=sub>справочник оценок пуст</span>'}</div>
      <div class="sub" style="margin:12px 0 4px">Титулы${r.titles.length?'':' — <b>все</b>'}:</div>
      <div style="display:flex;flex-wrap:wrap;gap:5px">${allT.map(n=>chip(r.id,'titles',n,r.titles.includes(n))).join('')||'<span class=sub>справочник титулов пуст</span>'}</div>
    </div>`).join('')||emptyBox('🏆','Рангов нет');
}
async function addRank(){
  const inp=$('#new_rank'); const name=inp.value.trim(); if(!name)return;
  await post('/api/ranks',{name,grades:[],titles:[]}); RANKS=await get('/api/ranks'); inp.value=''; renderRanks();
}
async function renameRank(id){
  const r=RANKS.find(x=>x.id===id); const name=prompt('Название ранга:',r.name); if(name==null||!name.trim())return;
  await post('/api/ranks',{id,name:name.trim(),grades:r.grades,titles:r.titles}); RANKS=await get('/api/ranks'); renderRanks();
}
async function delRank(id){
  if(!confirm('Удалить ранг?'))return;
  await del('/api/ranks/'+id); RANKS=await get('/api/ranks'); renderRanks();
}
async function toggleRank(id,kind,name){
  const r=RANKS.find(x=>x.id===id); const set=new Set(r[kind]);
  set.has(name)?set.delete(name):set.add(name); r[kind]=[...set];
  renderRanks();
  await post('/api/ranks',{id,name:r.name,grades:r.grades,titles:r.titles});
}

// ---- адреса ----
function refAddresses(box){
  box.innerHTML=`<p class="sub" style="margin-top:-4px">Общий справочник адресов — подставляется подсказками в адрес владельца и место проведения выставки.</p>
    <div class="bar"><div class="hspace" style="flex:1"></div>
      <button class="btn sm" onclick="addrForm()">＋ Адрес</button></div>
    <div class="list" id="addrlist"></div>`;
  renderAddresses();
}
function renderAddresses(){
  const l=$('#addrlist'); if(!l)return;
  l.innerHTML=ADDRESSES.map(a=>`
    <div class="card"><div class="row1"><div>
      <div class="title">${esc(a.name||a.address||'—')}</div>
      <div class="meta">${a.name?esc(a.address||''):''}${a.phone?` · 📞 ${esc(a.phone)}`:''}${a.note?` · ${esc(a.note)}`:''}</div>
    </div><div class="acts">
      <button class="icon-btn" onclick="addrForm(${a.id})">✏️</button>
      <button class="icon-btn del" onclick="delAddr(${a.id})">🗑</button></div></div></div>`).join('')
    ||emptyBox('📍','Адресов пока нет');
}
function addrForm(id){
  const a=id?ADDRESSES.find(x=>x.id===id):{};
  openModal(`<div class="mhead"><h3>${id?'Адрес':'Новый адрес'}</h3><button class="close" onclick="closeModal()">×</button></div>
    <div class="mbody"><form id="frm" class="formgrid">
      ${field('Метка','name',a.name,{full:true,ph:'Клуб «Олимп» / г. Тверь'})}
      ${field('Адрес','address',a.address,{full:true,rows:2})}
      ${field('Телефон','phone',a.phone,{type:'tel'})}
      ${field('Примечание','note',a.note)}
    </form></div>
    <div class="mfoot"><button class="btn ghost" onclick="closeModal()">Отмена</button>
      <button class="btn" onclick="saveAddr(${id||0})">Сохранить</button></div>`);
}
async function saveAddr(id){
  const v=formVals($('#frm')); if(!v.address&&!v.name){toast('Заполните адрес','err');return;}
  if(id)v.id=id;
  await post('/api/addresses',v); ADDRESSES=await get('/api/addresses'); closeModal(); toast('Сохранено','ok'); renderAddresses();
}
async function delAddr(id){
  if(!confirm('Удалить адрес?'))return;
  await del('/api/addresses/'+id); ADDRESSES=await get('/api/addresses'); renderAddresses();
}

// ============================================================ misc
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}
boot();
</script>
